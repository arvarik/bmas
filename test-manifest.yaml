    working_directory: mission-control
    timeout_seconds: 1200
    tools: [node, npm]
    depends_on: [mission-control.install]

  - id: mission-control.browser-install
    state: active_required
    owner: mission-control
    purpose: Install the exact pinned Playwright Chromium browser.
    argv: ["npx", "playwright", "install", "--with-deps", "chromium"]
    working_directory: mission-control
    timeout_seconds: 900
    tools: [node, npm, playwright]
    depends_on: [mission-control.install]

  - id: mission-control.e2e
    state: active_required
    owner: mission-control
    purpose: Run the Playwright end-to-end browser tests.
    argv: ["npm", "run", "test:e2e"]
    working_directory: mission-control
    timeout_seconds: 1800
    tools: [node, npm, playwright]
    depends_on: [mission-control.install, mission-control.browser-install]
    retry:
      max_attempts: 2
    artifacts:
      - "mission-control/test-results/**"

  # ── Reserved learning identifiers ────────────────────────────────
  # These entries hold stable future identifiers only. A reserved
  # entry has no command, never executes, and cannot enter a required
  # profile. The owning delivery stage activates each entry only after
  # its feature and test exist.
  - id: learning.trace-access-redaction
    state: reserved
    owner: learning
    purpose: Prove trace access control and redaction in the learning interface.
    activation_stage: Trace panel and access gate
  - id: learning.information-level-switching
    state: reserved
    owner: learning
    purpose: Prove correct progressive-disclosure level switching.
    activation_stage: Trace panel and access gate
  - id: learning.keyboard-navigation
    state: reserved
    owner: learning
    purpose: Prove complete keyboard navigation of the learning interface.
    activation_stage: Keyboard and semantic interface
  - id: learning.focus-stability
    state: reserved
    owner: learning
    purpose: Prove stable focus behavior during live updates.
    activation_stage: Keyboard and semantic interface
  - id: learning.accessibility-tree
    state: reserved
    owner: learning
    purpose: Prove a correct accessibility tree for every learning view.
    activation_stage: Keyboard and semantic interface
  - id: learning.mobile-layout
    state: reserved
    owner: learning
    purpose: Prove the mobile layout of the learning interface.
    activation_stage: Responsive and visual access
  - id: learning.zoom-200
    state: reserved
    owner: learning
    purpose: Prove the layout at 200 percent zoom.
    activation_stage: Responsive and visual access
  - id: learning.zoom-400
    state: reserved
    owner: learning
    purpose: Prove the layout at 400 percent zoom.
    activation_stage: Responsive and visual access
  - id: learning.forced-colors
    state: reserved
    owner: learning
    purpose: Prove readability under forced-colors mode.
    activation_stage: Responsive and visual access
  - id: learning.color-contrast
    state: reserved
    owner: learning
    purpose: Prove sufficient color contrast in every learning view.
    activation_stage: Responsive and visual access
  - id: learning.touch-targets
    state: reserved
    owner: learning
    purpose: Prove minimum touch-target sizes on mobile devices.
    activation_stage: Responsive and visual access
  - id: learning.reduced-motion
    state: reserved
    owner: learning
    purpose: Prove reduced-motion behavior in animated views.
    activation_stage: Responsive and visual access
  - id: learning.large-trace-performance
    state: reserved
    owner: learning
    purpose: Prove interface performance on large traces.
    activation_stage: Large-trace delivery
  - id: learning.metric-integrity
    state: reserved
    owner: learning
    purpose: Prove every displayed metric against its metric definition.
    activation_stage: Metric implementation
  - id: learning.study-contract
    state: reserved
    owner: learning
    purpose: Prove the study harness contract.
    activation_stage: Study harness delivery
  - id: learning.study-analysis-fixtures
    state: reserved
    owner: learning
    purpose: Prove study analysis against frozen fixtures.
    activation_stage: Study harness delivery

profiles:
  - id: complete
    description: >-
      Every active_required group. This is the local release gate and the
      exact set that continuous integration must also execute.
    selector:
      states: [active_required]

  - id: ci.daemon
    description: Continuous integration partition for daemon and repository checks.
    selector:
      groups:
        - manifest.validate
        - repo.source-naming
        - repo.config-examples
        - repo.config-schema
        - repo.docs-links
        - repo.compose-render
        - scripts.tests
        - conformance.reference-scorer
        - daemon.lint
        - daemon.typecheck
        - daemon.tests
        - daemon.runtime-routing
        - daemon.run-admission-recovery
        - daemon.terminal-outcome
        - daemon.post-terminal-invalidation
        - daemon.digest-profile
        - daemon.fence-and-cancellation
        - daemon.asset-boundary
        - daemon.human-controls
        - daemon.unit-of-work-atomicity
        - daemon.journal-replay
        - daemon.sqlite-operational
        - daemon.budget-arithmetic
        - daemon.budget-states
        - daemon.run-admission
        - daemon.activation-states
        - daemon.external-effects
        - daemon.agent-protocol
        - daemon.execution-envelope
        - daemon.evidence-authority
        - daemon.goal-concurrency
        - daemon.typed-indexes
        - daemon.keyed-digest
        - daemon.privacy-boundary
        - daemon.security-matrix
        - daemon.recovery-center
        - daemon.cross-runtime-conformance
        - daemon.populated-migration
        - daemon.release-gates
