name: CI

# Every job executes its checks through the authoritative test manifest
# (test-manifest.yaml). The manifest validator proves that these
# partition profiles exactly cover the same complete required set that
# the local scripts/check-ci.sh run executes, including Playwright.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── Daemon (Python) + repository contracts ─────────────────────────
  daemon:
    name: Daemon — tests + type-check + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daemon/requirements.txt
          pip install pytest pytest-asyncio httpx2 mypy ruff pyyaml jsonschema

      - name: Publish the resolved check list (daemon + repository contracts)
        run: python3 scripts/run-test-manifest.py --profile ci.daemon --list

      - name: Run the manifest partition (daemon + repository contracts)
        run: python3 scripts/run-test-manifest.py --profile ci.daemon

      - name: Upload the manifest result record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-manifest-result-daemon
          path: test-results/
          if-no-files-found: ignore

  # ── Agent (Python) ─────────────────────────────────────────────────
  agent:
    name: Agent — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f agent/requirements.txt ]; then pip install -r agent/requirements.txt; fi
          pip install pytest pytest-asyncio pyyaml jsonschema

      - name: Publish the resolved check list (agent)
        run: python3 scripts/run-test-manifest.py --profile ci.agent --list

      - name: Run the manifest partition (agent)
        run: python3 scripts/run-test-manifest.py --profile ci.agent

      - name: Upload the manifest result record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-manifest-result-agent
          path: test-results/
          if-no-files-found: ignore

  # ── Evaluation harness (Python) ───────────────────────────────────────
  evaluation:
    name: Evaluation harness — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml pytest pytest-asyncio jsonschema

      - name: Publish the resolved check list (evaluation)
        run: python3 scripts/run-test-manifest.py --profile ci.evaluation --list

      - name: Run the manifest partition (evaluation)
        run: python3 scripts/run-test-manifest.py --profile ci.evaluation

      - name: Upload the manifest result record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-manifest-result-evaluation
          path: test-results/
          if-no-files-found: ignore

  # ── Mission Control (Next.js / TypeScript) ─────────────────────────
  mission-control:
    name: Mission Control — lint + type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mission-control/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runner dependencies
        run: python3 -m pip install pyyaml jsonschema

      - name: Publish the resolved check list (mission-control)
        run: python3 scripts/run-test-manifest.py --profile ci.mission-control --list

      - name: Run the manifest partition (mission-control)
        run: python3 scripts/run-test-manifest.py --profile ci.mission-control

      - name: Upload the manifest result record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-manifest-result-mission-control
          path: test-results/
          if-no-files-found: ignore
