name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── Daemon (Python) ────────────────────────────────────────────────
  daemon:
    name: Daemon — tests + type-check + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx2 mypy ruff

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Tests (pytest)
        run: pytest tests/ -v --tb=short

      - name: Validate published configuration files
        run: python ../scripts/validate_configs.py

      - name: Verify generated configuration schema
        run: python ../scripts/generate_config_schema.py --check

      - name: Check documentation links
        working-directory: .
        run: python scripts/validate_docs.py

      - name: Validate Docker Compose
        working-directory: .
        run: docker compose --env-file .env.example config --quiet

  # ── Agent (Python) ─────────────────────────────────────────────────
  agent:
    name: Agent — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio

      - name: Tests (pytest)
        run: pytest tests/ -v --tb=short

  # ── Evaluation harness (Python) ───────────────────────────────────────
  evaluation:
    name: Evaluation harness — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pyyaml pytest pytest-asyncio

      - name: Tests (pytest)
        run: pytest eval/tests/ -v --tb=short

  # ── Mission Control (Next.js / TypeScript) ─────────────────────────
  mission-control:
    name: Mission Control — lint + type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mission-control
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mission-control/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Tests (vitest)
        run: npm run test:run

      - name: Build
        run: npm run build
