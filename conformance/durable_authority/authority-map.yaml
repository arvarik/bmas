# Durable authority map for Foundation Stage 0A.
#
# The map records every current durable write path. It names one
# authority for each table and one owner for each field, and it marks
# every derived field with its reconstruction rule.
# daemon/tests/test_durable_authority_map.py compares this map with
# the live migrated schema and with a scan of every SQL write in the
# daemon source, so no unknown writer or field owner can appear.
schema_id: bmas.durable_authority_map
metadata:
  contract_version: "1.0.0"
sqlite_tables:
  - table: agent_traces
    authority: daemon.trace-ingest
    purpose: "Recorded provider interaction telemetry per turn."
    writers:
      - database
    fields:
      - { name: id, owner: daemon.trace-ingest, derived: false }
      - { name: task_id, owner: daemon.trace-ingest, derived: false }
      - { name: turn_id, owner: daemon.trace-ingest, derived: false }
      - { name: seq, owner: daemon.trace-ingest, derived: false }
      - { name: role, owner: daemon.trace-ingest, derived: false }
      - { name: node, owner: daemon.trace-ingest, derived: false }
      - { name: type, owner: daemon.trace-ingest, derived: false }
      - { name: data, owner: daemon.trace-ingest, derived: false }
      - { name: model, owner: daemon.trace-ingest, derived: false }
      - { name: tokens_in, owner: daemon.trace-ingest, derived: false }
      - { name: tokens_out, owner: daemon.trace-ingest, derived: false }
      - { name: cost_usd, owner: daemon.trace-ingest, derived: false }
      - { name: created_at, owner: daemon.trace-ingest, derived: false }
  - table: artifacts
    authority: daemon.artifact-storage
    purpose: "Task output files that agents produced."
    writers:
      - database
    fields:
      - { name: id, owner: daemon.artifact-storage, derived: false }
      - { name: task_id, owner: daemon.artifact-storage, derived: false }
      - { name: turn_id, owner: daemon.artifact-storage, derived: false }
      - { name: author, owner: daemon.artifact-storage, derived: false }
      - { name: rel_path, owner: daemon.artifact-storage, derived: false }
      - { name: stored_path, owner: daemon.artifact-storage, derived: false }
      - { name: mime, owner: daemon.artifact-storage, derived: false }
      - name: bytes
        owner: daemon.artifact-storage
        derived: true
        reconstruction: "Measure the stored file size."
      - name: sha256
        owner: daemon.artifact-storage
        derived: true
        reconstruction: "Hash the stored file bytes."
      - { name: version, owner: daemon.artifact-storage, derived: false }
      - { name: created_at, owner: daemon.artifact-storage, derived: false }
  - table: benchmark_artifacts
    authority: daemon.benchmark-service
    purpose: "Benchmark execution record: benchmark artifacts."
    note: "No current code path writes this reserved table."
    writers: []
    fields:
      - { name: id, owner: daemon.benchmark-service, derived: false }
      - { name: run_id, owner: daemon.benchmark-service, derived: false }
      - { name: attempt_id, owner: daemon.benchmark-service, derived: false }
