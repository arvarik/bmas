      - { name: event_cursor, owner: daemon.event-delivery, derived: false }
      - name: attempts
        owner: daemon.event-delivery
        derived: true
        reconstruction: "Count delivery attempts for the event cursor."
      - name: last_error
        owner: daemon.event-delivery
        derived: true
        reconstruction: "Record the newest failed delivery attempt."
      - { name: queued_at, owner: daemon.event-delivery, derived: false }
      - name: last_attempt_at
        owner: daemon.event-delivery
        derived: true
        reconstruction: "Record the newest delivery attempt time."
  - table: log_entries
    authority: daemon.task-lifecycle
    purpose: "Structured task log lines."
    writers:
      - database
    fields:
      - { name: id, owner: daemon.task-lifecycle, derived: false }
      - { name: task_id, owner: daemon.task-lifecycle, derived: false }
      - { name: agent_role, owner: daemon.task-lifecycle, derived: false }
      - { name: level, owner: daemon.task-lifecycle, derived: false }
      - { name: message, owner: daemon.task-lifecycle, derived: false }
      - { name: fields, owner: daemon.task-lifecycle, derived: false }
      - { name: node, owner: daemon.task-lifecycle, derived: false }
      - { name: turn_id, owner: daemon.task-lifecycle, derived: false }
      - { name: created_at, owner: daemon.task-lifecycle, derived: false }
  - table: operator_actions
    authority: daemon.operator-audit
    purpose: "Audited operator interventions."
    writers:
      - database
    fields:
      - { name: action_id, owner: daemon.operator-audit, derived: false }
      - { name: task_id, owner: daemon.operator-audit, derived: false }
      - { name: action, owner: daemon.operator-audit, derived: false }
      - { name: actor, owner: daemon.operator-audit, derived: false }
      - { name: status, owner: daemon.operator-audit, derived: false }
      - { name: request_detail, owner: daemon.operator-audit, derived: false }
      - { name: result_detail, owner: daemon.operator-audit, derived: false }
      - { name: created_at, owner: daemon.operator-audit, derived: false }
      - { name: completed_at, owner: daemon.operator-audit, derived: false }
  - table: schema_version
    authority: daemon.storage-migrations
    purpose: "Applied storage migration level."
    writers:
      - database
    fields:
      - { name: version, owner: daemon.storage-migrations, derived: false }
      - { name: applied_at, owner: daemon.storage-migrations, derived: false }
  - table: sub_tasks
    authority: daemon.task-lifecycle
    purpose: "Variant-reported progress items for one task."
    writers:
      - database
    fields:
      - { name: id, owner: daemon.task-lifecycle, derived: false }
      - { name: task_id, owner: daemon.task-lifecycle, derived: false }
      - { name: label, owner: daemon.task-lifecycle, derived: false }
      - { name: status, owner: daemon.task-lifecycle, derived: false }
      - { name: agent_role, owner: daemon.task-lifecycle, derived: false }
      - { name: depends_on, owner: daemon.task-lifecycle, derived: false }
      - { name: result, owner: daemon.task-lifecycle, derived: false }
      - { name: error, owner: daemon.task-lifecycle, derived: false }
      - { name: started_at, owner: daemon.task-lifecycle, derived: false }
      - { name: completed_at, owner: daemon.task-lifecycle, derived: false }
      - { name: sort_order, owner: daemon.task-lifecycle, derived: false }
  - table: task_files
    authority: daemon.upload-storage
    purpose: "User-uploaded task input files."
    writers:
      - database
    fields:
      - { name: id, owner: daemon.upload-storage, derived: false }
      - { name: task_id, owner: daemon.upload-storage, derived: false }
      - { name: name, owner: daemon.upload-storage, derived: false }
      - { name: mime, owner: daemon.upload-storage, derived: false }
      - name: bytes
        owner: daemon.upload-storage
        derived: true
        reconstruction: "Measure the stored file size."
      - name: sha256
        owner: daemon.upload-storage
        derived: true
        reconstruction: "Hash the stored file bytes."
      - { name: stored_path, owner: daemon.upload-storage, derived: false }
      - name: extracted_chars
        owner: daemon.upload-storage
        derived: true
        reconstruction: "Count the extracted text characters."
      - { name: summary_entry, owner: daemon.upload-storage, derived: false }
      - { name: created_at, owner: daemon.upload-storage, derived: false }
  - table: tasks
    authority: daemon.task-lifecycle
    purpose: "One row per submitted task with its full lifecycle state and lease."
    writers:
      - database
    fields:
      - { name: id, owner: daemon.task-lifecycle, derived: false }
      - { name: label, owner: daemon.task-lifecycle, derived: false }
      - { name: full_input, owner: daemon.task-lifecycle, derived: false }
      - { name: status, owner: daemon.task-lifecycle, derived: false }
      - { name: complexity, owner: daemon.task-lifecycle, derived: false }
      - { name: model_used, owner: daemon.task-lifecycle, derived: false }
      - { name: error_message, owner: daemon.task-lifecycle, derived: false }
      - name: result_summary
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Project a display summary from result_json."
      - { name: result_json, owner: daemon.task-lifecycle, derived: false }
      - { name: metadata, owner: daemon.task-lifecycle, derived: false }
      - { name: created_at, owner: daemon.task-lifecycle, derived: false }
      - { name: started_at, owner: daemon.task-lifecycle, derived: false }
      - { name: completed_at, owner: daemon.task-lifecycle, derived: false }
      - name: duration_ms
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Subtract started_at from completed_at."
      - name: total_cost_usd
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Sum cost_entries.cost_usd for the task."
      - name: total_tokens
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Sum cost_entries input and output tokens for the task."
      - { name: archived_at, owner: daemon.task-lifecycle, derived: false }
      - { name: variant, owner: daemon.task-lifecycle, derived: false }
      - name: rounds_used
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Read the final round from board_meta control state."
      - { name: terminated_by, owner: daemon.task-lifecycle, derived: false }
      - { name: answer_source, owner: daemon.task-lifecycle, derived: false }
      - { name: phase, owner: daemon.task-lifecycle, derived: false }
      - { name: output_dir, owner: daemon.task-lifecycle, derived: false }
      - name: joules_estimate
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Sum cost_entries.joules_estimate for the task."
      - { name: run_state, owner: daemon.task-lifecycle, derived: false }
      - { name: resume_count, owner: daemon.task-lifecycle, derived: false }
      - { name: last_heartbeat_at, owner: daemon.task-lifecycle, derived: false }
      - { name: lease_token, owner: daemon.task-lifecycle, derived: false }
      - name: effective_actions
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Count effective actions from board_events."
      - { name: state_revision, owner: daemon.task-lifecycle, derived: false }
      - { name: checkpoint_at, owner: daemon.task-lifecycle, derived: false }
      - { name: terminal_kind, owner: daemon.task-lifecycle, derived: false }
      - { name: failure_category, owner: daemon.task-lifecycle, derived: false }
      - { name: cancel_requested_at, owner: daemon.task-lifecycle, derived: false }
  - table: turns
    authority: daemon.task-lifecycle
    purpose: "One row per dispatched agent turn."
    writers:
      - database
    fields:
      - { name: id, owner: daemon.task-lifecycle, derived: false }
      - { name: task_id, owner: daemon.task-lifecycle, derived: false }
      - { name: round_no, owner: daemon.task-lifecycle, derived: false }
      - { name: role, owner: daemon.task-lifecycle, derived: false }
      - { name: node, owner: daemon.task-lifecycle, derived: false }
      - { name: model, owner: daemon.task-lifecycle, derived: false }
      - { name: status, owner: daemon.task-lifecycle, derived: false }
      - name: entries_added
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Count board_entries with created_by_turn equal to the turn."
      - { name: started_at, owner: daemon.task-lifecycle, derived: false }
      - { name: completed_at, owner: daemon.task-lifecycle, derived: false }
      - name: cost_usd
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Sum cost_entries.cost_usd for the turn."
      - name: joules_estimate
        owner: daemon.task-lifecycle
        derived: true
        reconstruction: "Sum cost_entries.joules_estimate for the turn."
      - { name: actor, owner: daemon.task-lifecycle, derived: false }
      - { name: rationale, owner: daemon.task-lifecycle, derived: false }
      - { name: phase, owner: daemon.task-lifecycle, derived: false }
transient_migration_tables:
  - board_entries_v3
redis_domains:
  - id: redis.board
    owner: daemon.board-gateway
    purpose: "Live coordination state and event streams for active tasks. The durable SQLite board tables remain the recovery authority."
    key_patterns_fixture: conformance/runtime_fixtures/protocol-vocabulary.json
filesystem_domains:
  - id: filesystem.artifacts
    owner: daemon.artifact-storage
    root_configuration: storage.artifacts_dir
    purpose: "Task output files. The artifacts table stores each digest and size."
  - id: filesystem.uploads
    owner: daemon.upload-storage
    root_configuration: storage.user_media_dir
    purpose: "User-uploaded task inputs. The task_files table stores each digest and size."
