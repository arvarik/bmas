# bMAS Planner Profile, reviewed for Hermes Agent v0.20.4.
# Terminal and file tools can change host data. Use a sandbox or OS controls.

model:
  default: "medium"
  provider: "custom"
  base_url: "http://192.168.4.240:4000/v1"
  api_key: "${LITELLM_MASTER_KEY}"

toolsets:
  - web
  - browser
  - terminal
  - file
  - memory

platform_toolsets:
  cli:
    - web
    - browser
    - terminal
    - file
    - memory
  api_server:
    - web
    - browser
    - terminal
    - file
    - memory
