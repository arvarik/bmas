# The pinned test toolchain. Every component names the version line the
# manifest requires; the resolver records the exact resolved version in
# the run report and fails before tests when a resolved component
# violates its pin. A component marked required must resolve on every
# release worker; an optional component records "unresolved" when its
# binary is absent.
schema_id: bmas.toolchain_pins
metadata:
  contract_version: 1
components:
  python:
    required: true
    pin: "3.13"
    resolve: ["python3", "--version"]
  node:
    required: true
    pin: "22"
    resolve: ["node", "--version"]
  npm:
    required: true
    # Node.js 22 bundles npm 10 on the release worker; the developer
    # toolchain resolves npm 11. Both lines are accepted explicitly.
    pin: ["10", "11"]
    resolve: ["npm", "--version"]
  playwright:
    required: true
    pin: "1.62"
    resolve: ["node-package", "mission-control", "@playwright/test"]
  chromium:
    required: true
    pin: "1234"
    resolve: ["playwright-browser", "chromium"]
  redis:
    required: true
    # The Ubuntu release worker installs Redis 7.0 from apt; the
    # developer toolchain runs Redis 8. Both lines are accepted
    # explicitly until the worker image pins Redis 8.
    pin: ["7", "8"]
    resolve: ["redis-server", "--version"]
  sqlite:
    required: true
    pin: "3"
    resolve: ["python-sqlite"]
  wasmtime:
    # The wasmtime-py wheel bundles the Wasmtime runtime; the daemon
    # executes scorer components through it, so the pin resolves the
    # installed Python distribution instead of a separate binary.
    required: true
    pin: "48"
    resolve: ["python-distribution", "wasmtime"]
  numpy:
    # The vectorized frozen-analysis engine. The reference engine
    # stays available, so a host without NumPy still analyzes, but
    # the performance gate needs the vector toolchain.
    required: true
    pin: "2"
    resolve: ["python-distribution", "numpy"]
  statistics:
    # The arithmetic contract both analysis engines honour: binary64
    # operations in the published order with left-to-right
    # accumulation. The engine choice never changes a number.
    required: true
    pin: "binary64-sequential-summation"
    resolve: ["python-statistics-contract"]
