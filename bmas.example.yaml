# bMAS classic starter configuration
#
# Copy this file to bmas.yaml. The default Docker Compose stack uses its own
# internal service addresses. Keep control_plane.host as localhost for the
# single-host starter.

project:
  name: "My bMAS"
  description: "A classic blackboard multi-agent system"

control_plane:
  host: "localhost"
  ports:
    redis: 6379
    litellm: 4000
    triage: 8001
    daemon: 9000
    dashboard: 9321

# The starter agent runs in Docker and executes every classic role.
# Add external Hermes nodes later for tools, isolation, or more capacity.
nodes:
  - name: "starter-agent"
    host: "agent"
    port: 8000
    role: starter
    color: "#5eead4"

# Gemini triage uses LiteLLM. It does not need a local GPU.
triage:
  enabled: true
  backend: cloud
  model: "starter-model"
  default_complexity: medium

models:
  starter-model:
    provider: gemini
    model: "gemini-3.5-flash"
    api_key_env: GEMINI_API_KEY
    max_tokens: 65536
    # Control-plane calls ask a reasoning model for low effort and size
    # their completion budget for reasoning tokens. Set a level to force
    # an effort, or off to never send one. See docs/CONFIGURATION.md.
    reasoning: provider_default
    pricing:
      # Official Gemini API paid tier, verified 2026-08:
      # https://ai.google.dev/gemini-api/docs/pricing ($1.50 / $9.00 per 1M)
      input_cost_per_token: 1.5e-6
      output_cost_per_token: 9.0e-6

routing:
  simple: starter-model
  light: starter-model
  medium: starter-model
  complex: starter-model

coordination:
  variant: classic
  view_budget_tokens: 12000
  round_execution: concurrent

  classic:
    max_rounds: 4
    max_duration_s: 1800
    budget_ceiling_usd: 0.50
    max_concurrent_activations: 3
    experts_per_tier: {simple: 0, light: 1, medium: 2, complex: 4}
    cleaner_entry_threshold: 12
    cleaner_token_threshold: 8000
    cleaner_retention_weights:
      salience: 2.0
      confidence: 1.0
      recency: 0.1
      size_penalty: 0.01
    stall_rounds: 2
    max_replans: 2
    cu_mode: llm
    coordinator_narration: false
    sole_similarity: auto

  # Every classic role uses the one starter agent. Production deployments can
  # set preferred_host values or add more nodes.
  role_registry:
    planner: {preferred_host: null, profile: planner, dispatch_port: 8000}
    expert: {preferred_host: null, profile: expert, dispatch_port: 8000}
    critic: {preferred_host: null, profile: critic, dispatch_port: 8000}
    conflict_resolver: {preferred_host: null, profile: conflict_resolver, dispatch_port: 8000}
    cleaner: {preferred_host: null, profile: cleaner, dispatch_port: 8000}
    decider: {preferred_host: null, profile: decider, dispatch_port: 8000}

  board:
    max_entry_chars: 8000
    max_title_len: 200
    salience_weights:
      confidence: 0.4
      recency: 0.2
      refs_in: 0.3
      penalty: 0.3

storage:
  enabled: true
  user_media_dir: "/data/uploads"
  artifacts_dir: "/data/output"
  max_upload_mb: 50
  max_task_output_mb: 500
  allowed_upload_types: [pdf, txt, md, csv, json, png, jpg, docx]
  pdf_extraction: pymupdf
  extraction_max_chars: 60000

# Foundation writer gates. Each gate enables one planned Foundation
# writer. With run_context, runtime_unit_of_work, and
# budget_reservations on, the daemon admits every interactive task into
# one Foundation run (journal genesis, run budget with one reserved
# reservation, run-control row with the task fence) and dispatches
# through signed activation grants to an agent that publishes a
# qualified capability document. With the gates off, tasks keep the
# legacy bearer execute path. The test stack turns every gate on.
foundation_gates:
  runtime_registry: false
  run_context: false
  runtime_unit_of_work: false
  activation_ledger: false
  effect_ledger: false
  budget_reservations: false
  trace_envelope: false
  evidence_index: false
  goal_index: false
